version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: reachinbox-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: reachinbox-scheduler-app
    ports:
      - "3000:3000"
    environment:
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
      - WORKER_CONCURRENCY=5
      - MIN_DELAY_BETWEEN_EMAILS_MS=2000
      - MAX_EMAILS_PER_HOUR_PER_SENDER=10
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
